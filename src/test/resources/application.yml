spring:
  datasource:
    url: jdbc:tc:mysql:8.0:///pg?TC_DAEMON=true
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    hikari:
      connection-init-sql: SET SESSION innodb_lock_wait_timeout = 5
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

pg:
  scheduling:
    enabled: false
  settlement:
    fee-rate: 0.03

card:
  client: stub
