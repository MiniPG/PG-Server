spring:
  application:
    name: PG-Server
  datasource:
    url: jdbc:mysql://localhost:3306/pg?serverTimezone=Asia/Seoul
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false
