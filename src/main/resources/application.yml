spring:
  application:
    name: PG-Server
  datasource:
    url: jdbc:mysql://localhost:3306/pg?serverTimezone=Asia/Seoul
    username: root
    password: root
    hikari:
      data-source-properties:
        cachePrepStmts: true
        prepStmtCacheSize: 250
        prepStmtCacheSqlLimit: 2048
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        query:
          in_clause_parameter_padding: true
    show-sql: false

card:
  client: http
  base-url: http://localhost:8081
  connect-timeout: 1s
  read-timeout: 3s

pg:
  settlement:
    fee-rate: 0.03
    cron: "0 0 2 * * *"

server:
  tomcat:
    mbeanregistry:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,threaddump
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
        "[http.client.requests]": true
      slo:
        "[http.server.requests]": 50ms,100ms,200ms,600ms,800ms

logging:
  file:
    name: ${LOG_DIR:logs}/pg-server.log
  structured:
    format:
      file: logstash

  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 7
